<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중 지번 지적도 조회 (보안)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --paper:#F4F0E4;
    --paper-deep:#EAE3D0;
    --ink:#232722;
    --ink-soft:#5B5F57;
    --stamp-red:#A8362A;
    --stamp-red-deep:#7E2A21;
    --ledger-blue:#2A4258;
    --line:#D7CDB0;
    --line-strong:#B7A97F;
    --paper-shadow: rgba(35,39,34,0.12);
    --ok-green:#3E6B4F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; font-family:'Noto Sans KR', sans-serif;}
  
  /* 비밀번호 인증 화면 */
  #authOverlay{
    position:fixed; inset:0; z-index:99999;
    background:var(--ledger-blue);
    display:flex; align-items:center; justify-content:center;
    color:#EFE9D8;
  }
  .auth-box{
    background:#1D2E3C;
    padding:30px 40px;
    border-radius:8px;
    border:2px solid var(--stamp-red);
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
    text-align:center;
    width:320px;
  }
  .auth-box h2{ margin:0 0 10px; font-size:18px; color:#EFE9D8; }
  .auth-box p{ font-size:12px; color:#7C8D9B; margin-bottom:20px; }
  .auth-box input{
    width:100%; padding:10px; border-radius:4px; border:1px solid #3C566B;
    background:#2A4258; color:#fff; font-size:16px; text-align:center; margin-bottom:12px;
  }
  .auth-box button{
    width:100%; padding:10px; background:var(--stamp-red); color:#fff;
    border:none; border-radius:4px; font-weight:600; cursor:pointer;
  }
  .auth-box button:hover{ background:var(--stamp-red-deep); }
  .auth-err{ color:#E2A0A0; font-size:12px; margin-top:10px; min-height:16px; }

  /* 메인 서비스 화면 */
  #appContainer{ display:none; height:100vh; flex-direction:column; }
  .topbar{
    background:var(--ledger-blue); color:#EFE9D8; padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0;
    border-bottom:3px solid var(--stamp-red);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .seal{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:#C9A45C;
    border:1px solid #C9A45C; padding:2px 7px; border-radius:3px;
  }
  .brand h1{ margin:0; font-size:17px; font-weight:700; }
  .key-row{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .key-row input{
    background:#1D2E3C; border:1px solid #3C566B; color:#EFE9D8;
    padding:7px 10px; border-radius:4px; font-size:12px; width:220px;
  }
  .key-row button{
    background:var(--stamp-red); color:#fff; border:none; padding:7px 12px;
    border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .main{ flex:1; display:flex; min-height:0; }
  .sidebar{
    width:360px; flex-shrink:0; background:var(--paper); border-right:1px solid var(--line-strong);
    display:flex; flex-direction:column; box-shadow: 2px 0 10px var(--paper-shadow); z-index:5;
  }
  .add-form{ padding:16px; border-bottom:1px dashed var(--line-strong); }
  .add-form label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
  .add-form textarea{
    width:100%; height:80px; padding:8px; border:1px solid var(--line-strong);
    border-radius:4px; font-size:12.5px; background:#fff; resize:none;
  }
  .add-form button{
    width:100%; margin-top:6px; padding:8px 0; background:var(--ledger-blue);
    color:#F4F0E4; border:none; border-radius:4px; font-weight:600; cursor:pointer;
  }
  .list-wrap{ flex:1; overflow-y:auto; padding:10px 12px 12px; }
  .card{
    background:#fff; border:1px solid var(--line-strong); border-radius:6px;
    padding:10px 12px; margin-bottom:8px; display:flex; align-items:flex-start; gap:10px; cursor:pointer;
  }
  .card.active{ border-color:var(--stamp-red); }
  .badge{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; border:2px solid var(--stamp-red);
    color:var(--stamp-red); display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:12px; background:#FBF4EC;
  }
  .sidebar-footer{ border-top:1px solid var(--line-strong); padding:12px 14px; background:var(--paper-deep); }
  .footer-row{ display:flex; gap:8px; }
  .footer-row button{ flex:1; padding:8px; border-radius:4px; border:1px solid var(--line-strong); background:#fff; font-weight:600; cursor:pointer; }
  #map{ position:absolute; top:0; left:0; right:0; bottom:0; }
  .marker-badge{
    width:26px; height:26px; border-radius:50%; background:var(--stamp-red); border:2px solid #fff;
    color:#fff; font-weight:600; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<!-- 비밀번호 인증 모달 -->
<div id="authOverlay">
  <div class="auth-box">
    <h2>🔒 비밀 보안 접속</h2>
    <p>허가된 인원만 접근 가능합니다.</p>
    <input type="password" id="passInput" placeholder="비밀번호 입력">
    <button id="passBtn">접속하기</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- 서비스 메인 화면 -->
<div id="appContainer">
  <div class="topbar">
    <div class="brand">
      <span class="seal">NPL·地籍</span>
      <h1>다중 지번 지적도 조회</h1>
    </div>
    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="브이월드 API 키">
      <button id="saveKeyBtn">저장</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="add-form">
        <label>지번 주소 목록 (다중 붙여넣기)</label>
        <textarea id="addrInput" placeholder="예)&#10;경기도 화성시 향남읍 100-1&#10;경기도 화성시 향남읍 100-2"></textarea>
        <button id="addBtn">지번 일괄 등록</button>
      </div>
      <div class="list-wrap" id="listWrap"></div>
      <div class="sidebar-footer">
        <div class="footer-row">
          <button id="fitBtn">전체 보기</button>
          <button id="clearBtn" style="color:var(--stamp-red);">전체 삭제</button>
        </div>
      </div>
    </div>
    <div style="position:relative; flex:1;">
      <div id="map"></div>
    </div>
  </div>
</div>

<script>
// ---------- 비밀번호 인증 로직 ----------
const SECRET_PASSWORD = '0504'; // 💡 변경할 비밀번호 설정
const AUTH_KEY = 'npl_map_auth';

document.getElementById('passBtn').addEventListener('click', checkAuth);
document.getElementById('passInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkAuth(); });

function checkAuth(){
  const input = document.getElementById('passInput').value;
  if(input === SECRET_PASSWORD){
    localStorage.setItem(AUTH_KEY, 'true');
    unlockApp();
  } else {
    document.getElementById('authErr').textContent = '비밀번호가 일치하지 않습니다.';
  }
}

function unlockApp(){
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  initMap();
}

if(localStorage.getItem(AUTH_KEY) === 'true'){
  unlockApp();
}

// ---------- 앱 기능 로직 ----------
let map, cadastralLayer;
let parcels = JSON.parse(localStorage.getItem('parcel-list') || '[]');
let apiKey = localStorage.getItem('vworld-api-key') || 'B6C48A1E-87C1-3FDB-B35A-C9BA92749595';
let markerGroup;

function initMap(){
  if(map) return;
  document.getElementById('apiKeyInput').value = apiKey;
  map = L.map('map', { zoomControl: true }).setView([36.5, 127.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 }).addTo(map);
  markerGroup = L.layerGroup().addTo(map);
  
  rebuildCadastral();
  renderList();
  if(parcels.length) fitToAll();
}

function rebuildCadastral(){
  if(cadastralLayer) map.removeLayer(cadastralLayer);
  if(!apiKey) return;
  cadastralLayer = L.tileLayer.wms('https://api.vworld.kr/req/wms', {
    layers: 'lp_pa_cbnd_bubun', styles: 'lp_pa_cbnd_bubun', format: 'image/png', transparent: true, version: '1.3.0', key: apiKey, opacity: 0.75
  }).addTo(map);
}

document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
  apiKey = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('vworld-api-key', apiKey);
  rebuildCadastral();
});

function jsonpCall(url, params){
  return new Promise(res=>{
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    const script = document.createElement('script');
    window[cb] = (data)=>{ delete window[cb]; document.head.removeChild(script); res(data); };
    script.src = url + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.head.appendChild(script);
  });
}

async function geocode(addr){
  const p = { key: apiKey, service:'address', request:'getcoord', version:'2.0', crs:'epsg:4326', address: addr, type:'PARCEL', format:'json' };
  let r = await jsonpCall('https://api.vworld.kr/req/address', p);
  if(r?.response?.status === 'OK') return { lat: parseFloat(r.response.result.point.y), lng: parseFloat(r.response.result.point.x) };
  p.type = 'ROAD';
  r = await jsonpCall('https://api.vworld.kr/req/address', p);
  if(r?.response?.status === 'OK') return { lat: parseFloat(r.response.result.point.y), lng: parseFloat(r.response.result.point.x) };
  return null;
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const raw = document.getElementById('addrInput').value.trim();
  if(!raw) return;
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  for(let addr of lines){
    const coord = await geocode(addr);
    if(coord) parcels.push({ id: 'p_'+Date.now(), address: addr, lat: coord.lat, lng: coord.lng });
  }
  localStorage.setItem('parcel-list', JSON.stringify(parcels));
  renderList(); fitToAll(); document.getElementById('addrInput').value = '';
});

function renderList(){
  const wrap = document.getElementById('listWrap'); wrap.innerHTML = '';
  markerGroup.clearLayers();
  parcels.forEach((p, idx)=>{
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="badge">${idx+1}</div><div><b>${p.address}</b><br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small></div>`;
    card.addEventListener('click', ()=> map.setView([p.lat, p.lng], 18));
    wrap.appendChild(card);

    const icon = L.divIcon({ className:'', html: `<div class="marker-badge">${idx+1}</div>`, iconSize:[26,26] });
    L.marker([p.lat, p.lng], { icon }).addTo(markerGroup).bindPopup(p.address);
  });
}

function fitToAll(){
  if(!parcels.length) return;
  map.fitBounds(L.latLngBounds(parcels.map(p=>[p.lat, p.lng])), { padding: [50,50] });
}

document.getElementById('fitBtn').addEventListener('click', fitToAll);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('모두 삭제하시겠습니까?')){ parcels = []; localStorage.removeItem('parcel-list'); renderList(); }
});
</script>
</body>
</html>
